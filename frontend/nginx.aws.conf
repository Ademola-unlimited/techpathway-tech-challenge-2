
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React application
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for the frontend ECS service
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
